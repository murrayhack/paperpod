name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The ends of the supported range: the Pi runs 3.13, and
        # requires-python still claims 3.9.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # A pip old enough can install the extra silently and not at all, which
      # then reads as a missing-pytest failure rather than a packaging one.
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # No hardware extra: gpiozero is Pi-only, and keeping it out is what
      # makes the bindings and the HTTP client testable here at all.
      - name: Install
        run: python -m pip install -e '.[test]'

      - name: Test
        run: python -m pytest -q

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Default severity, which setup.sh already passes with nothing to report.
      # The optional checks are deliberately left off: enabling them adds 142
      # notes, all of them SC2250 (brace every reference) and SC2292 ([[ ]] over
      # [ ]) style preferences, plus SC2310/SC2312 firing on predicate functions
      # and guarded `cat`s that are all intentional here. Nothing above note
      # level, so turning them on would mean churning 142 sites for no
      # correctness gain.
      - name: Shellcheck
        run: shellcheck setup.sh
