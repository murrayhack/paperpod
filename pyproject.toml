[build-system]
requires = ["setuptools >= 66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpod"
version = "1.0.0"
description = "Buttons, volume and transport for an e-paper Mopidy player"
readme = "README.md"
requires-python = ">= 3.9"
license = { text = "MIT" }
# Nothing at runtime beyond the standard library: both APIs this drives are
# plain HTTP, so urllib is enough and there is no dependency to keep current.
dependencies = []

[project.optional-dependencies]
# Only installable on a Raspberry Pi. Kept out of the base dependencies so the
# bindings and the HTTP client can be developed and tested anywhere.
hardware = [
    # libgpiod's Python bindings. On Raspberry Pi OS this comes from apt as
    # python3-libgpiod; the wheel is here so a non-Pi checkout can still
    # resolve the extra.
    "gpiod >= 2.1",
]
test = [
    "pytest >= 7.0",
]

[project.scripts]
paperpod = "paperpod.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest puts the test directory on sys.path, not the root, so without this the
# tests only find the package once it is installed. They should run in a fresh
# checkout — that is the point of keeping libgpiod out of everything but app.py.
pythonpath = ["."]

[tool.setuptools]
packages = ["paperpod"]
